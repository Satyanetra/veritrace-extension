<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>VeriTrace</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #ffffff; --surface: #f6f6f8; --text: #17171a; --sub: #5b5b63; --border: #e2e2e6;
            --accent: #2a7bc4; --good: #0e9f6e; --info: #2a7bc4; --warn: #b96a00; --neutral: #8a8a92;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1d1d20; --surface: #26262a; --text: #ececee; --sub: #a3a3ab; --border: #34343a;
                --accent: #4c9be0; --good: #00d395; --info: #4c9be0; --warn: #f5a623; --neutral: #8a8a92;
            }
        }
        body {
            width: 360px; margin: 0; background: var(--bg); color: var(--text);
            font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        button { font: inherit; color: inherit; cursor: pointer; }
        svg { display: block; flex: none; }

        .top { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 700; }
        .main { padding: 18px 16px 6px; }
        h1 { margin: 0 0 4px; font-size: 18px; line-height: 1.25; }
        .lead { margin: 0 0 14px; color: var(--sub); }
        .go {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 11px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
            font-size: 14px; font-weight: 600;
        }
        .go:hover { filter: brightness(1.08); }
        .go:focus-visible, .link:focus-visible, .clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .msg { display: none; margin: 10px 0 0; padding: 9px 12px; border-radius: 8px; font-size: 13px; background: rgba(185,106,0,.12); color: var(--warn); }
        .msg.show { display: block; }

        .steps { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
        .steps li { display: flex; gap: 10px; align-items: flex-start; color: var(--text); }
        .n {
            width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border);
            display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--sub); flex: none;
        }

        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 18px 16px 0; padding: 12px 0 0; border-top: 1px solid var(--border); }
        .row label { flex: 1; cursor: pointer; }
        .row small { display: block; color: var(--sub); font-size: 12px; }
        .switch { position: relative; width: 38px; height: 22px; flex: none; }
        .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
        .track { position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background .15s ease; pointer-events: none; }
        .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
        .switch input:checked + .track { background: var(--accent); }
        .switch input:checked + .track::after { transform: translateX(16px); }
        .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

        .recent { padding: 18px 16px 4px; }
        .recent-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .recent-head h2 { margin: 0; font-size: 13px; font-weight: 700; }
        .clear { border: 0; background: none; color: var(--sub); font-size: 12px; padding: 2px 4px; }
        .clear:hover { color: var(--text); }
        .empty { margin: 0; padding: 14px; border: 1px dashed var(--border); border-radius: 8px; color: var(--sub); font-size: 13px; text-align: center; }
        .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 230px; overflow-y: auto; }
        .item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
        .thumb { width: 36px; height: 36px; border-radius: 6px; background: var(--surface) center / cover no-repeat; border: 1px solid var(--border); flex: none; }
        .item b { display: block; font-size: 13px; line-height: 1.3; }
        .item span { display: block; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin-left: auto; }
        .dot.good { background: var(--good); } .dot.info { background: var(--info); }
        .dot.warn { background: var(--warn); } .dot.neutral { background: var(--neutral); }

        .foot { display: flex; justify-content: center; padding: 14px 16px 16px; }
        .link { color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="top">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        VeriTrace
    </div>

    <div class="main">
        <h1>Check a picture or video</h1>
        <p class="lead">See if it has been registered by its creator on VeriTrace.</p>
        <button class="go" id="btn-pick" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            Check an image on this page
        </button>
        <div class="msg" id="msg" role="alert"></div>

        <ol class="steps">
            <li><span class="n">1</span><span>Press the button above.</span></li>
            <li><span class="n">2</span><span>Click the image or video you want to check.</span></li>
            <li><span class="n">3</span><span>Read the answer. It takes a few seconds.</span></li>
        </ol>
    </div>

    <div class="row">
        <label for="enableToggle">
            Show a Check button on images
            <small>Appears when you point at a picture.</small>
        </label>
        <span class="switch">
            <input type="checkbox" id="enableToggle" checked>
            <span class="track"></span>
        </span>
    </div>

    <div class="recent">
        <div class="recent-head">
            <h2>Recent checks</h2>
            <button class="clear" id="btn-clear" type="button" hidden>Clear</button>
        </div>
        <div id="history"></div>
    </div>

    <div class="foot">
        <a class="link" id="btn-site" href="https://verify.dpkvtrading.online" target="_blank" rel="noopener">Open VeriTrace website</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
