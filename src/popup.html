<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VeriTrace Lens</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            width: 380px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0A0A0F;
            color: #F0ECF8;
        }
        /* Top Navigation Header bar matching website navbar */
        .app-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(155, 125, 255, 0.16);
            background: #0F0F18;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .brand h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #FFF;
        }
        .account-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(155, 125, 255, 0.1);
            border: 1px solid rgba(155, 125, 255, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-family: monospace;
            color: #B8A0FF;
        }
        .account-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00D395;
            box-shadow: 0 0 6px #00D395;
        }
        /* Wallet Main Card */
        .card-container {
            padding: 16px;
        }
        .status-hero {
            text-align: center;
            padding: 10px 0 14px 0;
            background: rgba(15, 15, 24, 0.6);
            border: 1px solid rgba(155, 125, 255, 0.16);
            border-radius: 14px;
            margin-bottom: 14px;
        }
        .status-hero .value {
            font-size: 20px;
            font-weight: 800;
            color: #FFF;
            margin: 0 0 4px 0;
        }
        .status-hero .subtext {
            font-size: 11px;
            color: #00D395;
            font-weight: 600;
        }

        /* Clean Action Bar */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .actions-grid .action-btn.full-width {
            grid-column: 1 / -1;
        }
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #151520;
            border: 1px solid rgba(155, 125, 255, 0.2);
            border-radius: 10px;
            padding: 10px;
            color: #F0ECF8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn.primary {
            background: linear-gradient(135deg, #7C5CFC, #9B7DFF);
            border: none;
            color: #FFF;
            box-shadow: 0 4px 14px rgba(155, 125, 255, 0.3);
        }
        .action-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }
        .action-btn svg {
            color: currentColor;
        }

        /* Network & Toggle Row */
        .network-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(155, 125, 255, 0.08);
            border: 1px solid rgba(155, 125, 255, 0.25);
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #B8A0FF;
            margin-bottom: 14px;
        }

        /* Activity List Header */
        .activity-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #8A80AC;
            margin-bottom: 8px;
        }

        /* Recent Activity / Log list */
        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
        }
        .activity-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #111119;
            border: 1px solid rgba(155, 125, 255, 0.14);
            padding: 10px;
            border-radius: 10px;
        }
        .activity-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(155, 125, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9B7DFF;
        }

        /* Switch CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 18px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #222;
            transition: .2s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #9B7DFF;
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }
    </style>
</head>
<body>
    <!-- Web3 App Header Bar -->
    <div class="app-bar">
        <div class="brand">
            <svg width="20" height="20" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="pop-grad" x1="85%" y1="5%" x2="15%" y2="95%">
                        <stop offset="0%" stop-color="#B8A0FF" />
                        <stop offset="50%" stop-color="#9B7DFF" />
                        <stop offset="100%" stop-color="#7C5CFC" />
                    </linearGradient>
                </defs>
                <path d="M28 24 L44 24 L52 64 L56 76 L40 76 L36 64 Z" fill="#FFFFFF" />
                <path d="M36 56 L44 56 L56 76 L52 64 L88 24 L76 24 L48 60 Z" fill="url(#pop-grad)" />
            </svg>
            <h2>VeriTrace</h2>
        </div>
        <div class="account-pill">
            <span class="account-dot"></span>
            <span>Arbitrum Sepolia</span>
        </div>
    </div>

    <div class="card-container">
        <!-- Main Hero Status Header -->
        <div class="status-hero">
            <div class="value">VeriTrace Lens</div>
            <div class="subtext">● Arbitrum Stylus Active</div>
        </div>

        <!-- Action Buttons: Inspect Page (primary, full-width), Quick Verify + Open Web App -->
        <div class="actions-grid">
            <button class="action-btn primary full-width" id="btn-scan">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                Inspect Page (AI Scan)
            </button>
            <button class="action-btn" id="btn-verify">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                Quick Check
            </button>
            <button class="action-btn" id="btn-site">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                Open Web App
            </button>
        </div>

        <!-- Network Selector & Active Toggle -->
        <div class="network-pill">
            <span>Extension Enabled</span>
            <label class="switch">
                <input type="checkbox" id="enableToggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <!-- Verification History Log -->
        <div class="activity-header">Recent Inspections & Hashes</div>
        <div class="activity-list">
            <div class="activity-item">
                <div class="activity-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </div>
                <div class="activity-info" style="flex:1;">
                    <div style="font-size:12px; font-weight:700; color:#FFF;">Arbitrum Stylus Active</div>
                    <div style="font-size:10px; color:#8A80AC; margin-top:2px;">Hover over any image or video to verify</div>
                </div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
