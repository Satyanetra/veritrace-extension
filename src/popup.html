<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>VeriTrace Lens</title>
    <style>
        body {
            width: 250px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background: #111;
            color: #eee;
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        p {
            margin: 0 0 16px 0;
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #222;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .toggle-row span {
            font-size: 13px;
            font-weight: 600;
        }
        /* Switch CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 34px;
            height: 20px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .2s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #00D395;
        }
        input:checked + .slider:before {
            transform: translateX(14px);
        }
    </style>
</head>
<body>
    <h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00D395" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        VeriTrace Lens
    </h2>
    <p>Hover over any image on the web to instantly verify its blockchain provenance.</p>
    
    <div class="toggle-row">
        <span>Enable Hover Tool</span>
        <label class="switch">
            <input type="checkbox" id="enableToggle" checked>
            <span class="slider"></span>
        </label>
    </div>
</body>
</html>
